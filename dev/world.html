<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Preview — Crimson Bolt</title>
<script type="importmap">{"imports":{
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  :root { --bg: #0b1320; --panel: rgba(12, 18, 30, 0.86); --line: rgba(255, 255, 255, 0.12); --ink: #e8edf5; --dim: #93a1b5; --accent: #ff4a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; justify-content: center; align-items: stretch; }
  #stage { position: relative; height: 100%; flex: 0 0 auto; background: #000; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 8px; top: 8px; padding: 6px 8px; background: rgba(0, 0, 0, 0.45); border-radius: 6px; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; pointer-events: none; }
  #panel { position: fixed; right: 12px; top: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
  #panel h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: 0.04em; }
  #panel h1 b { color: var(--accent); }
  #panel p.sub { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
  .row { margin: 10px 0; }
  .row label { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .row label output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .biomes button { flex: 1 1 30%; font-size: 12px; padding: 4px 6px; }
  .stages button { flex: 1 1 22%; font-weight: 600; letter-spacing: 0.03em; padding: 5px 4px; }
  .stats { font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); white-space: pre; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
  .stats b { color: var(--ink); font-weight: 600; }
  .warn { color: #ffb14a; }
  #toggle { position: fixed; right: 12px; top: 12px; display: none; z-index: 3; }
  .keys { color: var(--dim); font-size: 11px; margin-top: 8px; }
  @media (max-width: 760px) {
    #panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 55%; display: none; }
    #panel.open { display: block; }
    #toggle { display: block; }
  }
  body.noui #panel, body.noui #toggle, body.noui #hud { display: none !important; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="hud"></div></div></div>
<button id="toggle">☰ World</button>
<div id="panel">
  <h1><b>赤電</b> World preview</h1>
  <p class="sub">Scrolling terrain · biomes · water · clouds · space · time of day</p>
  <div class="row btns stages" id="stages"></div>
  <div class="row"><label>Distance <output id="dOut">0</output></label><input id="dist" type="range" min="0" max="1600" step="1" value="0"></div>
  <div class="row biomes btns" id="jumps"></div>
  <div class="row"><label>Scroll speed <output id="sOut">7</output></label><input id="speed" type="range" min="0" max="80" step="0.5" value="7"></div>
  <div class="row btns">
    <button id="fly" class="on" title="Auto-scroll (F)">Fly</button>
    <button id="quality" title="Toggle world quality (Q)">Quality: high</button>
    <button id="bloom" class="on" title="Bloom post-process like the game's HIGH setting (B)">Bloom</button>
    <button id="ph" class="on" title="Placeholder jet + enemy bullets for contrast checks (P)">Placeholders</button>
    <button id="lanes" title="Overlay the guaranteed-clear lanes, cross roads and corridors (L)">Clear zones</button>
    <button id="freeze" title="Freeze the world's clock (animation and scroll) for repeatable frames; ?t=<seconds> starts frozen (T)">Freeze</button>
    <button id="scan" title="Build every chunk of this stage (d 0–1600) at the current quality and report violations and build times (S)">Scan stage</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="stats" id="scanOut"></div>
  <div class="keys">Keys: 1–9 stage · ←/→ scrub ±10 · F fly · T freeze · Q quality · B bloom · P placeholders · L zones · S scan · H hide UI</div>
</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { World, GROUND_Y, LANES_X, CROSS_ROAD_PERIOD, WORLD_STAGES } from '../js/world.js';

const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const STAGE_IDS = Object.keys(WORLD_STAGES);
const opt = {
  d: +(Q.get('d') || 0), speed: Q.has('speed') ? +Q.get('speed') : 7, fly: Q.get('fly') !== '0',
  quality: Q.get('q') === 'low' ? 'low' : 'high', bloom: Q.get('bloom') !== '0', ph: Q.get('ph') !== '0',
  lanes: Q.get('lanes') === '1', ui: Q.get('ui') !== '0', freeze: Q.has('t'), t: +(Q.get('t') || 0),
  stage: STAGE_IDS.includes(Q.get('stage')) ? Q.get('stage') : 'coastal',
};
if (!opt.ui) document.body.classList.add('noui');

// --- renderer / scene exactly like the game's core ------------------------------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', stencil: false });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fc4e0, 60, 140);
const camera = new THREE.PerspectiveCamera(40, 0.5, 1, 260);
camera.position.set(0, 41, 9);
camera.lookAt(0, 0, -6);
// debug: ?cam=wide zooms out to inspect layout beyond the playfield (not the game's view)
if (Q.get('cam') === 'wide') { camera.position.set(0, 95, 18); camera.lookAt(0, 0, -14); camera.far = 400; camera.updateProjectionMatrix(); }
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x3b3226, 1.1);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(-14, 30, 10);
scene.add(hemi, sun, sun.target);

const world = new World({ scene, renderer, sun, hemi, quality: opt.quality, stage: opt.stage });
if (opt.freeze) { world._t = opt.t; world._clock = opt.t; }
world.reset(opt.d);

// --- placeholders: red jet + glowing enemy bullets (same recipe as the game) ---
const ph = new THREE.Group();
scene.add(ph);
function makeJet() {
  const g = new THREE.Group();
  const red = new THREE.MeshStandardMaterial({ color: 0xc8202a, roughness: 0.55, metalness: 0.3, flatShading: true });
  const white = new THREE.MeshStandardMaterial({ color: 0xe6e8ec, roughness: 0.6, metalness: 0.2, flatShading: true });
  const glass = new THREE.MeshStandardMaterial({ color: 0x3fd0ff, roughness: 0.2, metalness: 0.1, emissive: 0x0a4a66, flatShading: true });
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.22, 1.8, 6), red); body.rotation.x = -Math.PI / 2; g.add(body);
  const wing = new THREE.Mesh(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, -0.35), new THREE.Vector3(-0.8, 0, 0.45), new THREE.Vector3(0.8, 0, 0.45),
  ]), white); wing.geometry.computeVertexNormals(); wing.material.side = THREE.DoubleSide; g.add(wing);
  const can = new THREE.Mesh(new THREE.SphereGeometry(0.13, 6, 4), glass); can.scale.set(1, 0.8, 2.2); can.position.set(0, 0.12, -0.25); g.add(can);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.55, 0.2).multiplyScalar(4) }));
  glow.position.set(0, 0, 0.9); glow.scale.set(1.3, 1, 2.2); g.add(glow);
  return g;
}
const jet = makeJet(); jet.position.set(0, 0, 5); ph.add(jet);
// fake drop shadow like core's placeShadow (offset along the sun direction, on the ground)
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32, depthWrite: false });
const jetShadow = makeJet(); jetShadow.traverse((o) => { if (o.isMesh) o.material = shadowMat; }); jetShadow.scale.set(1, 0.01, 1); ph.add(jetShadow);

const NB = 64;
const bulletGeo = new THREE.PlaneGeometry(1, 1); bulletGeo.rotateX(-Math.PI / 2);
// procedural glow (same look as the game's ORB sprite: soft halo + hot white core)
const GLOW = `float r = length(vUv - 0.5) * 2.0; float g0 = clamp(1.0 - r, 0.0, 1.0); float glow = g0 * g0 * (0.6 + 0.4 * g0); float c0 = clamp(1.0 - r / 0.42, 0.0, 1.0); float core = c0 * (0.8 + 0.2 * c0);`;
const bulletMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec2 vUv; varying vec3 vC; void main(){ vUv = uv; vC = instanceColor; gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec2 vUv; varying vec3 vC; void main(){ ${GLOW}
    vec3 col = vC * glow + vec3(core) * 1.6 * (0.6 + 0.4 * max(vC.r, max(vC.g, vC.b))); gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`,
});
const underMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec2 vUv; void main(){ ${GLOW} gl_FragColor = vec4(0.06, 0.0, 0.07, glow * 0.75); }`,
});
const bullets = new THREE.InstancedMesh(bulletGeo, bulletMat, NB); bullets.renderOrder = 10; bullets.frustumCulled = false;
const under = new THREE.InstancedMesh(bulletGeo, underMat, NB); under.renderOrder = 9; under.frustumCulled = false;
const B_COLOR = [[2.6, 0.42, 1.3], [2.9, 1.15, 0.25], [2.4, 0.45, 2.3], [3.0, 0.55, 0.18]];
const B_SIZE = [0.66, 1.08, 0.34, 1.2];
const bl = []; // x, z, kind, ring centre etc.
for (let i = 0; i < NB; i++) {
  const ringI = i % 4;
  const kind = [0, 1, 0, 3][ringI];
  bl.push({ ring: ringI, a: (i / NB) * Math.PI * 2 * 4, kind });
  bullets.setColorAt(i, new THREE.Color(...B_COLOR[kind]));
}
ph.add(bullets, under);
const RINGS = [[-4.5, -16, 3.2], [4.5, -9, 2.6], [-3, -1, 2.4], [5, -20, 2.0]];
const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
function updatePlaceholders(t) {
  jet.position.x = Math.sin(t * 0.5) * 2.4;
  jet.rotation.z = -Math.cos(t * 0.5) * 0.35;
  const h = jet.position.y - GROUND_Y;
  jetShadow.position.set(jet.position.x + h * 0.467, GROUND_Y + 0.06, jet.position.z - h * 0.333);
  jetShadow.rotation.set(0, 0, 0);
  for (let i = 0; i < NB; i++) {
    const b = bl[i], R = RINGS[b.ring];
    const a = b.a + t * (b.ring % 2 ? 0.35 : -0.3);
    const r = R[2] + Math.sin(t * 0.8 + b.ring) * 0.4;
    const s = B_SIZE[b.kind];
    _p.set(R[0] + Math.cos(a) * r, 0.1, R[1] + Math.sin(a) * r);
    _m.compose(_p, _q, _s.set(s, 1, s)); bullets.setMatrixAt(i, _m);
    _p.y = 0.05; _m.compose(_p, _q, _s.set(s * 1.45, 1, s * 1.45)); under.setMatrixAt(i, _m);
  }
  bullets.instanceMatrix.needsUpdate = true; under.instanceMatrix.needsUpdate = true;
}

// --- clear-zone overlay ---------------------------------------------------------
const zoneGeo = new THREE.BufferGeometry();
const ZMAX = 64;
const zonePos = new Float32Array(ZMAX * 2 * 3);
zoneGeo.setAttribute('position', new THREE.BufferAttribute(zonePos, 3).setUsage(THREE.DynamicDrawUsage));
const zones = new THREE.LineSegments(zoneGeo, new THREE.LineBasicMaterial({ color: 0xff3355, depthTest: false, transparent: true, opacity: 0.9 }));
zones.renderOrder = 20; zones.frustumCulled = false; scene.add(zones);
function updateZones() {
  zones.visible = opt.lanes;
  if (!opt.lanes) return;
  const st = WORLD_STAGES[world.stage];
  const d = world.distance, y = GROUND_Y + 0.05;
  let n = 0;
  const seg = (x0, z0, x1, z1) => { if (n >= ZMAX) return; const o = n * 6; zonePos.set([x0, y, z0, x1, y, z1], o); n++; };
  const land = (dd) => dd >= st.clear.from && dd < st.clear.to;
  const z0 = 20, z1 = -45;
  const dA = d - z0, dB = d - z1;
  const la = Math.max(dA, st.clear.from), lb = Math.min(dB, st.clear.to);
  if (lb > la) for (const lx of LANES_X) for (const s of [-1, 1]) seg(lx + s, d - la, lx + s, d - lb);
  for (let c = Math.ceil((dA - 20) / CROSS_ROAD_PERIOD) * CROSS_ROAD_PERIOD + 20; c < dB; c += CROSS_ROAD_PERIOD) {
    if (!land(c)) continue;
    for (const s of [-1.5, 1.5]) seg(-22, d - c - s, 22, d - c - s);
  }
  // mid-boss / boss corridors (|x| < x over d0..d1)
  for (const c of st.corridors) {
    const a = Math.max(dA, c.d0), b = Math.min(dB, c.d1);
    if (b <= a) continue;
    for (const s of [-1, 1]) seg(s * c.x, d - a, s * c.x, d - b);
    if (c.d0 >= dA) seg(-c.x, d - c.d0, c.x, d - c.d0);
    if (c.d1 <= dB) seg(-c.x, d - c.d1, c.x, d - c.d1);
  }
  zoneGeo.setDrawRange(0, n * 2); zoneGeo.attributes.position.needsUpdate = true;
}

// --- stage scan: build every chunk of the stage at the current quality (violations, build ms) ---
function scan(d0 = 0, d1 = 1600) {
  const ch = world.chunks[0];
  const v0 = world.stats.violations, log0 = world.stats.violationLog.length;
  let maxMs = 0, sumMs = 0, n = 0, maxVerts = 0, maxShadow = 0, maxK = 0;
  for (let k = Math.floor(d0 / 40) - 1; k <= Math.ceil(d1 / 40) + 1; k++) {
    world._maskSlot.fill(-99999);
    world._build(ch, k);
    sumMs += ch.ms; n++;
    if (ch.ms > maxMs) { maxMs = ch.ms; maxK = k; }
    maxVerts = Math.max(maxVerts, ch.n); maxShadow = Math.max(maxShadow, ch.sn);
  }
  world.reset(world.distance);
  return { stage: world.stage, quality: world.quality, chunks: n, violations: world.stats.violations - v0,
    log: world.stats.violationLog.slice(log0, log0 + 12), maxMs: +maxMs.toFixed(2), maxMsK: maxK, avgMs: +(sumMs / n).toFixed(2), maxVerts, maxShadow };
}
function showScan(r) {
  $('scanOut').innerHTML = `scan <b>${r.stage}</b>/${r.quality} d 0–1600: ${r.chunks} chunks\n` +
    `violations <b class="${r.violations ? 'warn' : ''}">${r.violations}</b>\n` +
    `build avg <b>${r.avgMs}ms</b>  max <b>${r.maxMs}ms</b> (k ${r.maxMsK})\n` +
    `verts <b>${r.maxVerts}</b>/${world.quality === 'low' ? 60000 : 96000}  shadow <b>${r.maxShadow}</b>/30000` +
    (r.log.length ? '\n' + r.log.map((e) => JSON.stringify(e)).join('\n') : '');
  console.log('[scan]', JSON.stringify(r));
}

// --- post-processing (HIGH quality in the game) --------------------------------
let composer, bloom, W = 0, H = 0;
function resize() {
  const ih = window.innerHeight, iw = window.innerWidth;
  const w = Math.min(iw, Math.round(ih * 0.5625));
  W = w; H = ih;
  stage.style.width = w + 'px';
  renderer.setSize(w, ih, false);
  camera.aspect = w / ih;
  if (Q.get('cam') === 'game') {
    // emulate the game's View.fit(): the camera backs off on narrow screens
    const tanH = Math.tan(20 * Math.PI / 180) * camera.aspect;
    const D = Math.min(66, Math.max(30, 8.4 / tanH + 3.42)), T = 20 * Math.PI / 180;
    camera.position.set(0, D * Math.cos(T), -6 + D * Math.sin(T)); camera.lookAt(0, 0, -6);
  }
  camera.updateProjectionMatrix();
  if (composer) { composer.setSize(w, ih); bloom.setSize(w, ih); }
}
resize();
composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: Q.get("rt") === "byte" ? THREE.UnsignedByteType : THREE.HalfFloatType, samples: +(Q.get("msaa") ?? 0) }));
composer.addPass(new RenderPass(scene, camera));
bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.72, 0.42, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());
window.addEventListener('resize', resize);

// --- UI -------------------------------------------------------------------------
const distEl = $('dist'), speedEl = $('speed');
let dragging = false;
distEl.addEventListener('pointerdown', () => { dragging = true; });
window.addEventListener('pointerup', () => { dragging = false; });
distEl.addEventListener('input', () => { world.reset(+distEl.value); });
speedEl.value = opt.speed;
speedEl.addEventListener('input', () => { opt.speed = +speedEl.value; });
const setBtn = (id, on, label) => { const b = $(id); b.classList.toggle('on', on); if (label) b.textContent = label; };
const toggles = {
  fly: () => { opt.fly = !opt.fly; setBtn('fly', opt.fly); },
  quality: () => { opt.quality = opt.quality === 'high' ? 'low' : 'high'; world.setQuality(opt.quality); setBtn('quality', opt.quality === 'high', 'Quality: ' + opt.quality); },
  bloom: () => { opt.bloom = !opt.bloom; setBtn('bloom', opt.bloom); },
  ph: () => { opt.ph = !opt.ph; setBtn('ph', opt.ph); },
  lanes: () => { opt.lanes = !opt.lanes; setBtn('lanes', opt.lanes); },
  freeze: () => { opt.freeze = !opt.freeze; setBtn('freeze', opt.freeze); },
};
for (const k in toggles) $(k).addEventListener('click', toggles[k]);
setBtn('fly', opt.fly); setBtn('quality', opt.quality === 'high', 'Quality: ' + opt.quality); setBtn('bloom', opt.bloom); setBtn('ph', opt.ph); setBtn('lanes', opt.lanes); setBtn('freeze', opt.freeze);
$('scan').addEventListener('click', () => showScan(scan()));
// stage selector + one jump button per biome of the current stage
const stagesEl = $('stages'), jumps = $('jumps');
for (const id of STAGE_IDS) {
  const b = document.createElement('button');
  b.id = 'stage-' + id; b.textContent = `${STAGE_IDS.indexOf(id) + 1} ${id}`;
  b.addEventListener('click', () => setStage(id, 0));
  stagesEl.appendChild(b);
}
function buildJumps() {
  jumps.textContent = '';
  for (const L of world.layout) {
    const b = document.createElement('button');
    b.textContent = `${L.biome} ${L.from}`;
    b.addEventListener('click', () => world.reset(L.from + 10));
    jumps.appendChild(b);
  }
}
function setStage(id, d = world.distance) {
  opt.stage = id;
  world.setStage(id);
  world.reset(d);
  for (const s of STAGE_IDS) setBtn('stage-' + s, s === id);
  buildJumps();
  $('scanOut').textContent = '';
}
for (const s of STAGE_IDS) setBtn('stage-' + s, s === opt.stage);
buildJumps();
$('toggle').addEventListener('click', () => $('panel').classList.toggle('open'));
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowright') world.reset(world.distance + 10);
  else if (k === 'arrowleft') world.reset(Math.max(0, world.distance - 10));
  else if (k >= '1' && k <= '9' && STAGE_IDS[+k - 1]) setStage(STAGE_IDS[+k - 1], 0);
  else if (k === 'f') toggles.fly(); else if (k === 'q') toggles.quality(); else if (k === 'b') toggles.bloom();
  else if (k === 'p') toggles.ph(); else if (k === 'l') toggles.lanes(); else if (k === 's') showScan(scan()); else if (k === 't') toggles.freeze();
  else if (k === 'h') document.body.classList.toggle('noui');
});

// --- stats: world-only draw calls / triangles measured with a direct render ------
const stats = { fps: 60, world: { calls: 0, tris: 0 }, total: { calls: 0, tris: 0 }, t: 0 };
renderer.info.autoReset = false;
function measure() {
  const vis = ph.visible, zv = zones.visible;
  ph.visible = false; zones.visible = false;
  renderer.info.reset(); renderer.render(scene, camera);
  stats.world.calls = renderer.info.render.calls; stats.world.tris = renderer.info.render.triangles;
  ph.visible = vis; zones.visible = zv;
}
function statsText() {
  const i = world.info();
  const w = stats.world;
  const warnC = w.calls > 70 ? ' warn' : '', warnT = w.tris > 150000 ? ' warn' : '';
  return `stage <b>${i.stage}</b>  d <b>${i.distance.toFixed(1)}</b>  biome <b>${i.biome}</b>\n` +
    `fps <b>${stats.fps.toFixed(0)}</b>   quality <b>${world.quality}</b>\n` +
    `world calls <b class="${warnC}">${w.calls}</b> / 70   tris <b class="${warnT}">${(w.tris / 1000).toFixed(1)}k</b> / 150k\n` +
    `frame calls <b>${stats.total.calls}</b>   tris <b>${(stats.total.tris / 1000).toFixed(1)}k</b>\n` +
    `chunks <b>${i.activeChunks}</b>  built <b>${i.builds}</b>  last <b>${i.lastBuildMs.toFixed(1)}ms</b>  max <b>${i.maxBuildMs.toFixed(1)}ms</b>\n` +
    `violations <b class="${i.violations ? 'warn' : ''}">${i.violations}</b>   water <b>${i.water ? 'on' : 'off'}</b>   deck <b>${i.deck ? 'on' : 'off'}</b>   space <b>${i.space ? 'on' : 'off'}</b>` +
    (i.body ? `   body <b>${i.body}</b>` : '') + (opt.freeze ? '   <b>frozen</b>' : '');
}

// --- loop -----------------------------------------------------------------------
let last = performance.now(), t = 0, logT = 0, measureT = 1;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; t += dt;
  stats.fps = stats.fps * 0.93 + (dt > 0 ? 1 / dt : 60) * 0.07;
  world.update(opt.freeze ? 0 : dt, opt.fly ? opt.speed : 0);   // frozen: the clock and the scroll stand still
  ph.visible = opt.ph;
  if (opt.ph) updatePlaceholders(t);
  updateZones();
  if (!dragging) { distEl.value = Math.min(1600, world.distance); }
  $('dOut').textContent = world.distance.toFixed(0);
  $('sOut').textContent = opt.speed.toFixed(1);
  measureT += dt;
  if (measureT > 0.5) { measureT = 0; measure(); }
  renderer.info.reset();
  if (opt.bloom) composer.render(); else renderer.render(scene, camera);
  stats.total.calls = renderer.info.render.calls; stats.total.tris = renderer.info.render.triangles;
  const txt = statsText();
  $('stats').innerHTML = txt;
  $('hud').textContent = txt.replace(/<[^>]+>/g, '');
  logT += dt;
  if (logT > 2) {
    logT = 0;
    const i = world.info();
    console.log(`[world] stage=${i.stage} d=${i.distance.toFixed(0)} biome=${i.biome} fps=${stats.fps.toFixed(0)} worldCalls=${stats.world.calls} worldTris=${stats.world.tris} ` +
      `frameCalls=${stats.total.calls} chunks=${i.activeChunks} buildMs=${i.lastBuildMs.toFixed(1)}/${i.maxBuildMs.toFixed(1)} violations=${i.violations}`);
  }
}
requestAnimationFrame(frame);

// hooks for automated checks
window.__wd = {
  THREE, world, renderer, scene, camera, opt, stats, WORLD_STAGES,
  set(o) {
    Object.assign(opt, o);
    if (o.quality) { world.setQuality(o.quality); setBtn('quality', o.quality === 'high', 'Quality: ' + o.quality); }
    if (o.stage) setStage(o.stage, o.d !== undefined ? o.d : 0);
    else if (o.d !== undefined) world.reset(o.d);
  },
  measure() { measure(); const i = world.info(); return { ...i, calls: stats.world.calls, tris: stats.world.tris }; },
  step(dt, speed) { world.update(dt, speed); },
  scan,
};
</script>
